[project]
name = "mlat-solver"
version = "0.1.0"
description = "Decentralized multilateration pipeline"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "torch>=2.2",
    "pymodes>=2.14",
    "filterpy>=1.4",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "kafka-python>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.hatch.build.targets.wheel]
packages = ["mlat"]
